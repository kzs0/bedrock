name: Test Report

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Tests execute pull-request code; do not leave the comment-capable
          # token in the checkout's git configuration.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.13"
          cache: true

      # -count=1: bypass test result cache
      # -coverprofile: per-statement coverage for all packages
      - name: Run tests
        id: tests
        run: |
          set +e
          : > test-diagnostics.txt
          package_output=$(go list ./... 2>test-diagnostics.txt)
          list_status=$?
          if (( list_status != 0 )); then
            printf '%s\n' "$package_output" >> test-diagnostics.txt
            cat test-diagnostics.txt >&2
            : > test-results.json
            echo "exit_code=$list_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          packages=()
          while IFS= read -r package; do
            case "$package" in
              */example|*/example/*) ;;
              *) packages+=("$package") ;;
            esac
          done <<< "$package_output"
          if (( ${#packages[@]} == 0 )); then
            echo "go list returned no non-example packages" | tee test-diagnostics.txt >&2
            : > test-results.json
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          coverpkg=$(IFS=,; echo "${packages[*]}")
          go test -json -count=1 \
            -coverpkg="$coverpkg" \
            -coverprofile=coverage.out \
            -covermode=atomic \
            "${packages[@]}" > test-results.json 2>&1
          test_status=$?
          cat test-results.json
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"

      - name: Generate coverage summary
        run: go tool cover -func=coverage.out > coverage.txt 2>/dev/null || touch coverage.txt

      - name: Generate coverage inventory
        if: always()
        continue-on-error: true
        run: python3 scripts/coverage-inventory.py coverage.out > coverage-inventory.md

      - name: Upload coverage inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-coverage
          retention-days: 14
          path: |
            coverage.out
            coverage.txt
            coverage-inventory.md
            test-results.json
            test-diagnostics.txt

      - name: Check aggregate coverage
        id: coverage
        run: |
          set +e
          ./scripts/enforce-coverage.sh coverage.out 80.0
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate E2E report rendering
        run: node --test scripts/e2e-report.test.cjs

      - name: Run functional E2E report
        id: e2e
        run: |
          set +e
          make e2e-coverage E2E_TEST_FLAGS=-json > e2e-diagnostics.txt 2>&1
          status=$?
          cat e2e-diagnostics.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "go_version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          go tool cover -func=coverage-e2e.out > coverage-e2e.txt 2>/dev/null || touch coverage-e2e.txt

      - name: Upload E2E report artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-report-coverage
          retention-days: 14
          path: |
            e2e-diagnostics.txt
            coverage-e2e.out
            coverage-e2e.txt
            coverage-e2e-inventory.md

      # Parse test-results.json (NDJSON from go test -json), build a markdown
      # summary, and post it as a PR comment — updating any previous one.
      - name: Post test report comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Fork pull requests receive a read-only token. Reporting must not mask
        # the authoritative test/coverage gate when commenting is unavailable.
        continue-on-error: true
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          COVERAGE_EXIT_CODE: ${{ steps.coverage.outputs.exit_code }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          E2E_GO_VERSION: ${{ steps.e2e.outputs.go_version }}
        with:
          script: |
            const fs = require('fs');

            // ── Parse NDJSON ────────────────────────────────────────────────
            let events = [];
            const diagnostics = [];
            try {
              const discoveryDiagnostics = fs.readFileSync('test-diagnostics.txt', 'utf8').trim();
              if (discoveryDiagnostics) diagnostics.push(discoveryDiagnostics);
            } catch (e) {
              core.warning(`test-diagnostics.txt unreadable: ${e.message}`);
            }
            try {
              for (const line of fs.readFileSync('test-results.json', 'utf8').trim().split('\n')) {
                if (!line) continue;
                try {
                  events.push(JSON.parse(line));
                } catch {
                  diagnostics.push(line);
                }
              }
            } catch (e) {
              core.warning(`test-results.json unreadable: ${e.message}`);
            }
            diagnostics.push(...events.filter(ev => ev.Action === 'output' && ev.Output).map(ev => ev.Output));

            // ── Aggregate per package ───────────────────────────────────────
            const pkgs = {};          // pkg → { pass, fail, skip, elapsed, status, cov }
            const failOutput = {};    // "pkg||test" → { pkg, test, lines[] }

            for (const ev of events) {
              if (!ev.Package) continue;
              pkgs[ev.Package] ??= { pass: 0, fail: 0, skip: 0, elapsed: 0, status: '', cov: '' };
              const p = pkgs[ev.Package];

              if (!ev.Test) {
                if (ev.Action === 'pass' || ev.Action === 'fail') {
                  p.status  = ev.Action;
                  p.elapsed = ev.Elapsed ?? 0;
                }
                if (ev.Action === 'output' && ev.Output) {
                  const m = ev.Output.match(/coverage:\s+([\d.]+)%/);
                  if (m) p.cov = m[1] + '%';
                }
              } else {
                if (ev.Action === 'pass') p.pass++;
                if (ev.Action === 'skip') p.skip++;
                if (ev.Action === 'fail') {
                  p.fail++;
                  const key = `${ev.Package}||${ev.Test}`;
                  failOutput[key] ??= { pkg: ev.Package, test: ev.Test, lines: [] };
                }
                if (ev.Action === 'output') {
                  const key = `${ev.Package}||${ev.Test}`;
                  if (failOutput[key]) failOutput[key].lines.push(ev.Output);
                }
              }
            }

            // ── Totals ──────────────────────────────────────────────────────
            let totalPass = 0, totalFail = 0, totalSkip = 0;
            for (const p of Object.values(pkgs)) {
              totalPass += p.pass;
              totalFail += p.fail;
              totalSkip += p.skip;
            }
            const testExit = Number.parseInt(process.env.TEST_EXIT_CODE ?? '1', 10);
            const coverageExit = Number.parseInt(process.env.COVERAGE_EXIT_CODE ?? '1', 10);
            const { renderE2EReport } = require('./scripts/e2e-report.cjs');
            const readReport = file => fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
            const e2eReport = renderE2EReport({
              log: readReport('e2e-diagnostics.txt'),
              coverage: readReport('coverage-e2e.txt'),
              exitCode: process.env.E2E_EXIT_CODE,
              goVersion: process.env.E2E_GO_VERSION,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            const anyFailed = testExit !== 0 || coverageExit !== 0 || !e2eReport.passed;

            // ── Parse function-level coverage (go tool cover -func output) ──
            const mod = 'github.com/kzs0/bedrock';
            let totalCov = 'N/A';
            const uncoveredByPkg = {}; // pkg → [{ file, func }]
            const lowCovByPkg   = {}; // pkg → [{ file, func, pct }]  (<80%, >0%)

            try {
              const lines = fs.readFileSync('coverage.txt', 'utf8').trim().split('\n');
              for (const line of lines) {
                // "total: (statements)  64.4%"
                const tot = line.match(/^total:\s+\(statements\)\s+([\d.]+)%/);
                if (tot) { totalCov = tot[1] + '%'; continue; }

                // "github.com/kzs0/bedrock/cloud.go:34:   FuncName   100.0%"
                const m = line.match(/^(.+):(\d+):\s+(\S+)\s+([\d.]+)%\s*$/);
                if (!m) continue;

                const [, filePath, , fnName, pctStr] = m;
                const pct = parseFloat(pctStr);

                // Derive short package label from file path
                const rel = filePath.replace(mod + '/', '');
                const slash = rel.lastIndexOf('/');
                const pkg  = slash >= 0 ? `${mod}/${rel.slice(0, slash)}` : mod;
                const file = slash >= 0 ? rel.slice(slash + 1) : rel;

                // Skip example binary and generated files
                if (pkg.includes('/example')) continue;

                if (pct === 0) {
                  uncoveredByPkg[pkg] ??= [];
                  uncoveredByPkg[pkg].push({ file, func: fnName });
                } else if (pct < 80) {
                  lowCovByPkg[pkg] ??= [];
                  lowCovByPkg[pkg].push({ file, func: fnName, pct });
                }
              }
            } catch (e) {
              core.warning(`coverage.txt parse failed: ${e.message}`);
            }

            // ── Package table ───────────────────────────────────────────────
            const tableRows = Object.entries(pkgs)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([pkg, p]) => {
                const label = pkg === mod ? '_(root)_' : `\`${pkg.replace(mod + '/', '')}\``;
                const icon  = p.status === 'pass' ? '✅' : p.status === 'fail' ? '❌' : '⚠️';
                const total = p.pass + p.fail + p.skip;
                const dur   = p.elapsed > 0 ? (p.elapsed * 1000).toFixed(0) + ' ms' : '—';
                return `| ${label} | ${icon} | ${total} | ${p.pass} | ${p.fail} | ${p.skip} | ${dur} | ${p.cov || '—'} |`;
              });

            const table = [
              '| Package | | Tests | ✅ Pass | ❌ Fail | ⏭ Skip | Duration | Library coverage exercised |',
              '|---------|:-:|------:|-------:|-------:|-------:|---------:|---------|',
              ...tableRows,
            ].join('\n');

            // ── Failed test details (collapsible) ───────────────────────────
            const failSections = Object.values(failOutput).map(({ pkg, test, lines }) => {
              const label = `${pkg.replace(mod + '/', '')} — ${test}`;
              const out   = lines.join('').trim().replace(/`/g, "'").slice(0, 3000);
              return [
                '<details>',
                `<summary><code>${label}</code></summary>`,
                '',
                '```',
                out,
                '```',
                '</details>',
              ].join('\n');
            });

            // ── Compose body ────────────────────────────────────────────────
            const headline = anyFailed ? '### Tests need attention' : '### All tests passed';
            const unitResult = `${totalPass} passed${totalFail ? ` · ${totalFail} failed` : ''}${totalSkip ? ` · ${totalSkip} skipped` : ''}`;
            const e2eResult = e2eReport.passed ? `${e2eReport.passedCount} scenarios passed` : 'Failed or incomplete';
            const parts = [
              '<!-- bedrock-test-report -->', headline, '',
              '| Suite | Result | Coverage |', '|---|---|---:|',
              `| Unit | ${unitResult} | ${totalCov} |`,
              `| E2E (${e2eReport.version}) | ${e2eResult} | ${e2eReport.coverage} |`, '',
              '<sub>Unit: all core packages. E2E: linked library code, excluding fixtures. These percentages are separate.</sub>', '',
              `[Logs & coverage inventories](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`, '',
              e2eReport.markdown, '',
              testExit !== 0 || coverageExit !== 0 ? '<details open>' : '<details>',
              '<summary>Unit test details</summary>', '', table,
            ];

            if (failSections.length > 0) {
              parts.push('', '### Failures', '', ...failSections);
            }
            if (testExit !== 0) {
              const diagnosticText = diagnostics.join('\n').trim().replace(/`/g, "'").slice(-12000)
                || 'No test diagnostics were produced.';
              parts.push(
                '',
                '<details>',
                '<summary>Raw test diagnostics</summary>',
                '',
                '```',
                diagnosticText,
                '```',
                '</details>',
              );
            }

            // ── Uncovered functions (0%) ────────────────────────────────────
            const uncovPkgs = Object.entries(uncoveredByPkg)
              .sort(([a], [b]) => a.localeCompare(b));

            if (uncovPkgs.length > 0) {
              const rows = [];
              for (const [pkg, funcs] of uncovPkgs) {
                const label = pkg === mod ? '_(root)_' : `\`${pkg.replace(mod + '/', '')}\``;
                for (const { file, func } of funcs) {
                  rows.push(`| ${label} | \`${file}\` | \`${func}\` |`);
                }
              }
              parts.push(
                '',
                '<details>',
                `<summary>${rows.length} functions not covered by unit tests</summary>`,
                '',
                '| Package | File | Function |',
                '|---------|------|----------|',
                ...rows,
                '</details>',
              );
            }

            // ── Low-coverage functions (<80%, >0%) ──────────────────────────
            const lowPkgs = Object.entries(lowCovByPkg)
              .sort(([a], [b]) => a.localeCompare(b));

            if (lowPkgs.length > 0) {
              const rows = [];
              for (const [pkg, funcs] of lowPkgs) {
                const label = pkg === mod ? '_(root)_' : `\`${pkg.replace(mod + '/', '')}\``;
                for (const { file, func, pct } of funcs.sort((a, b) => a.pct - b.pct)) {
                  rows.push(`| ${label} | \`${file}\` | \`${func}\` | ${pct.toFixed(1)}% |`);
                }
              }
              parts.push(
                '',
                '<details>',
                `<summary>${rows.length} functions with partial unit coverage</summary>`,
                '',
                '| Package | File | Function | Coverage |',
                '|---------|------|----------|---------|',
                ...rows,
                '</details>',
              );
            }

            parts.push('', '</details>', '', `<sub>Updated for ${context.sha.slice(0, 7)}</sub>`);
            const body = parts.join('\n');

            // ── Post or update comment ──────────────────────────────────────
            const marker = '<!-- bedrock-test-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Fail the workflow after the comment is posted so the PR is blocked.
      - name: Enforce test pass
        if: steps.tests.outputs.exit_code != '0' || steps.coverage.outputs.exit_code != '0' || steps.e2e.outputs.exit_code != '0'
        run: |
          echo "Tests, coverage, or E2E failed — see the PR comment for details."
          exit 1
