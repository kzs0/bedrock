name: Native Fuzz

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/pprof
            target: FuzzParseUncompressed
          - package: ./privacy
            target: FuzzPolicyNestedValues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.3"
          cache: true
      - name: Run extended native fuzzing
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          go test -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime=5m -parallel=2 -timeout=7m "$FUZZ_PACKAGE" 2>&1 | tee fuzz.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-failure-${{ matrix.target }}
          retention-days: 14
          path: |
            fuzz.log
            internal/pprof/testdata/fuzz/
            privacy/testdata/fuzz/
